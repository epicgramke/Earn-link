<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | EarnLink</title><link rel="stylesheet" href="auth.css"></head><body><div class="auth-wrap"><div class="brand">⚡ Earn<span>Link</span></div><div class="card"><p class="eyebrow">START EARNING</p><h1>Create your account</h1><p class="muted">Create your EarnLink account using your phone number and a secure password.</p><form id="signupForm"><label>Phone number<input id="phone" type="tel" inputmode="tel" placeholder="+2547XXXXXXXX" required></label><label>Password<input id="password" type="password" minlength="8" placeholder="At least 8 characters" required></label><label>Confirm password<input id="confirm" type="password" minlength="8" placeholder="Repeat your password" required></label><label class="check"><input id="terms" type="checkbox" required> I agree to the Terms and Privacy Policy.</label><button class="primary" type="submit">Create Account →</button><p id="message" class="message"></p></form><p class="switch">Already have an account? <a href="login.html">Log in</a></p><p class="demo-note">Phone authentication must be enabled in Supabase before real accounts can be created.</p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const ready=SUPABASE_URL.startsWith("http")&&!SUPABASE_ANON_KEY.startsWith("YOUR_");const sb=ready?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;document.getElementById("signupForm").addEventListener("submit",async e=>{e.preventDefault();const msg=document.getElementById("message"),p=document.getElementById("password").value;if(p!==document.getElementById("confirm").value){msg.textContent="Passwords do not match.";msg.className="message error";return}if(!ready){msg.textContent="Add your Supabase URL and publishable/anon key in config.js first.";msg.className="message error";return}msg.textContent="Creating account...";const{error}=await sb.auth.signUp({phone:document.getElementById("phone").value.trim(),password:p});if(error){msg.textContent=error.message;msg.className="message error";return}msg.textContent="Account created. Check your SMS if phone verification is enabled.";msg.className="message success"});</script></body></html>
