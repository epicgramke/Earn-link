<section class="upload-section">
  <h2>UPLOAD YOUR PROOF</h2>

  <p class="upload-description">
    Submit your screen recording for task verification.
  </p>

  <label for="proof" class="upload-box">
    <span class="upload-icon">☁</span>
    <strong>SELECT YOUR VIDEO</strong>
    <small>MP4, MOV or other video formats</small>
    <span class="choose-file">CHOOSE FILE</span>
  </label>

  <input
    type="file"
    id="proof"
    accept="video/*"
    hidden
  >

  <div class="selected-file" id="fileName">
    <span>🎥</span>
    <span>No video selected</span>
  </div>

  <button id="submitTask" class="submit-proof" disabled>
    SUBMIT PROOF →
  </button>

  <p id="taskMsg" class="task-message">
    Your submission will be marked pending review.
  </p>
</section>
