
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EARNLINK | COMPLETE TASK</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #090909;
      color: #f7f5ee;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 500px;
      margin: 25px auto;
      padding: 25px;
      background: #141414;
      border: 1px solid #d9b34b;
      border-radius: 15px;
    }

    h2, h3 {
      color: #d9b34b;
      text-align: center;
    }

    .reward {
      text-align: center;
      color: #f2d77d;
      font-size: 22px;
      font-weight: bold;
    }

    .instructions {
      background: #202020;
      padding: 15px;
      border-radius: 8px;
      line-height: 1.6;
    }

    .timer {
      color: red;
      border: 2px solid red;
      padding: 15px;
      text-align: center;
      font-size: 35px;
      font-weight: bold;
      border-radius: 10px;
      margin: 20px 0;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      background: #d9b34b;
      color: #090909;
      text-decoration: none;
      text-align: center;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    .upload-section {
      margin-top: 25px;
      padding: 15px;
      border: 1px solid #444;
      border-radius: 10px;
    }

    input[type="file"] {
      width: 100%;
      margin: 15px 0;
      color: white;
    }

    .submit-proof:disabled {
      background: #555;
      color: #aaa;
      cursor: not-allowed;
    }

    #taskMsg {
      text-align: center;
      line-height: 1.5;
      color: #f2d77d;
      margin-top: 15px;
    }

    .back {
      color: #d9b34b;
      display: block;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2 id="taskName">LOADING TASK...</h2>

    <p class="reward" id="reward">KSh 10</p>

    <div class="instructions" id="instructions">
      COMPLETE THE YOUTUBE CONTENT REVIEW.
      SCREEN RECORD YOUR COMPLETION.
    </div>

    <div class="timer" id="timer">00:30</div>

    <a id="target" class="btn" href="#">
      OPEN YOUTUBE →
    </a>

    <div class="upload-section">

      <h3>UPLOAD YOUR MP4 FOR VERIFICATION</h3>

      <input
        type="file"
        id="proof"
        accept=".mp4,video/mp4"
      >

      <button
        id="submitTask"
        class="btn submit-proof"
        type="button"
        disabled
      >
        NEXT →
      </button>

      <p id="taskMsg">
        OPEN YOUTUBE AND COMPLETE THE REVIEW.
      </p>

    </div>

    <a href="index.html" class="back">
      ← BACK TO TASKS
    </a>

  </div>

  <script src="assets/script.js"></script>

</body>
</html>
