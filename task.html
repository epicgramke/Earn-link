
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarnLink | Task</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <a class="brand" href="index.html">EARN<span>LINK</span></a>
  </header>

  <main class="container narrow">

    <div class="panel task-detail">

      <p class="eyebrow">AVAILABLE TASK</p>

      <h1 id="taskName">Task</h1>

      <div class="reward">
        Reward: <b id="reward">KSh 0</b>
      </div>

      <div class="timer" id="timer">01:00:00</div>

      <p id="instructions">
        Complete the task according to the instructions below.
      </p>

      <a id="target" class="btn full" href="#" target="_blank" rel="noopener noreferrer">
        Search on YouTube →
      </a>

      <button class="btn full" id="startTimer">
        Start 1-Hour Research Timer
      </button>

      <div class="record">

        <h2>Upload Task Proof</h2>

        <p>
          Complete your research and upload your proof video for review.
        </p>

        <input
          id="proof"
          type="file"
          accept="video/*,image/*,.pdf"
        >

        <button class="btn full" id="submitTask">
          Submit for Verification
        </button>

        <p id="taskMsg" class="msg"></p>

      </div>

    </div>

  </main>

  <nav class="bottom-navigation">
    <a href="index.html">Home</a>
    <a href="tasks.html" class="active">Tasks</a>
    <a href="wallet.html">Wallet</a>
  </nav>

  <script src="script.js"></script>

</body>
</html>
