<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | EarnLink</title><link rel="stylesheet" href="auth.css"></head><body><div class="auth-wrap"><div class="brand">⚡ Earn<span>Link</span></div><div class="card"><p class="eyebrow">WELCOME BACK</p><h1>Log in</h1><p class="muted">Sign in with the phone number and password you used to register.</p><form id="loginForm"><label>Phone number<input id="phone" type="tel" inputmode="tel" placeholder="+2547XXXXXXXX" required></label><label>Password<input id="password" type="password" placeholder="Your password" required></label><button class="primary" type="submit">Log In →</button><p id="message" class="message"></p></form><p class="switch">Don't have an account? <a href="signup.html">Create one</a></p><p class="demo-note">Authentication is handled by Supabase. Your password is not stored in this website's code.</p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const ready=SUPABASE_URL.startsWith("http")&&!SUPABASE_ANON_KEY.startsWith("YOUR_");const sb=ready?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const msg=document.getElementById("message");if(!ready){msg.textContent="Add your Supabase URL and publishable/anon key in config.js first.";msg.className="message error";return}msg.textContent="Signing in...";const{error}=await sb.auth.signInWithPassword({phone:document.getElementById("phone").value.trim(),password:document.getElementById("password").value});if(error){msg.textContent=error.message;msg.className="message error";return}location.href="index.html"});</script></body></html>
