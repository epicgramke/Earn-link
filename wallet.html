
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>EARNLINK | Wallet</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TOP BRAND ONLY -->
  <header class="topbar">
    <a class="brand" href="index.html">
      EARN<span>LINK</span>
    </a>
  </header>

  <main class="container">

    <!-- WALLET TITLE -->
    <div class="page-title">
      <p class="eyebrow">YOUR MONEY</p>
      <h1>Wallet</h1>
      <p>View your approved earnings and request a withdrawal.</p>
    </div>

    <!-- BALANCES -->
    <section class="balance-grid">

      <div class="balance-card">
        <small>AVAILABLE</small>
        <strong>KSh 0.00</strong>
      </div>

      <div class="stat">
        <small>PENDING</small>
        <strong>KSh 0.00</strong>
      </div>

      <div class="stat">
        <small>TOTAL EARNED</small>
        <strong>KSh 0.00</strong>
      </div>

    </section>

    <!-- WITHDRAWAL -->
    <div class="panel">
      <h2>M-PESA withdrawal</h2>

      <input type="tel" placeholder="M-PESA number">

      <input type="number" placeholder="Amount (KSh)">

      <button class="btn">Request withdrawal</button>

      <p class="muted">
        Withdrawal processing will be connected to the backend later.
      </p>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-navigation" aria-label="Main navigation">

      <a href="index.html">
        <span class="nav-icon">⌂</span>
        <small>Home</small>
      </a>

      <a href="tasks.html">
        <span class="nav-icon">▦</span>
        <small>Tasks</small>
      </a>

      <a class="active" href="wallet.html">
        <span class="nav-icon">▣</span>
        <small>Wallet</small>
      </a>

    </nav>

  </main>

  <script src="script.js"></script>

</body>
</html>
