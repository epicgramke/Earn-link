
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>EARNLINK | Wallet</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  <a class="brand" href="index.html">
    EARN<span>LINK</span>
  </a>
</header>

<main class="container">

  <div class="page-title">
    <p class="eyebrow">YOUR MONEY</p>
    <h1>Wallet</h1>
    <p>Manage your earnings and withdrawals.</p>
  </div>

  <!-- BALANCES -->
  <section class="balance-grid">

    <div class="balance-card">
      <small>AVAILABLE BALANCE</small>
      <strong id="availableBalance">KSh 0.00</strong>
    </div>

    <div class="stat">
      <small>PENDING</small>
      <strong id="pendingBalance">KSh 0.00</strong>
    </div>

    <div class="stat">
      <small>TOTAL EARNED</small>
      <strong id="totalEarned">KSh 0.00</strong>
    </div>

  </section>

  <!-- WITHDRAWAL -->
  <section class="panel">
    <h2>M-PESA Withdrawal</h2>

    <form id="withdrawForm">

      <label for="mpesaNumber">M-PESA Number</label>
      <input
        type="tel"
        id="mpesaNumber"
        placeholder="07XXXXXXXX"
        pattern="(07|01)[0-9]{8}|254(7|1)[0-9]{8}"
        required
      >

      <label for="withdrawAmount">Amount (KSh)</label>
      <input
        type="number"
        id="withdrawAmount"
        placeholder="Enter amount"
        min="1"
        step="1"
        required
      >

      <button type="submit" class="btn">
        Request Withdrawal
      </button>

    </form>

    <p class="muted" id="withdrawMessage">
      Withdrawals will be processed after backend integration.
    </p>
  </section>

  <!-- TRANSACTION HISTORY -->
  <section class="panel">
    <h2>Transaction History</h2>

    <div id="transactionHistory">
      <p class="muted">No transactions yet.</p>
    </div>
  </section>

  <!-- NAVIGATION -->
  <nav class="bottom-navigation" aria-label="Main navigation">

    <a href="index.html">
      <span class="nav-icon">⌂</span>
      <small>Home</small>
    </a>

    <a href="tasks.html">
      <span class="nav-icon">▦</span>
      <small>Tasks</small>
    </a>

    <a class="active" href="wallet.html">
      <span class="nav-icon">▣</span>
      <small>Wallet</small>
    </a>

  </nav>

</main>

<script src="script.js"></script>

</body>
</html>
